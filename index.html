<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三數學互動引導：除法小偵探 (3.2)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts 圓體字型風格 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at top left, #FEF08A, #BAE6FD 55%, #FBCFE8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        /* 卡通立體按鈕與卡片 */
        .btn-3d {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
        }
        .btn-3d:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
        }
        .card-cartoon {
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.1);
        }
        /* 動畫效果 */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(2deg); }
        }
        .animate-float {
            animation: float-slow 2.6s infinite ease-in-out;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        .animate-wiggle {
            animation: wiggle 1.4s infinite ease-in-out;
        }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes shake-no {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-4deg); }
            40%, 80% { transform: translateX(8px) rotate(4deg); }
        }
        .shake-no {
            animation: shake-no 0.45s ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7); }
            50% { box-shadow: 0 0 0 12px rgba(251, 146, 60, 0); }
        }
        .pulse-glow {
            animation: pulse-glow 1.8s infinite;
        }
        /* 可拖曳物件樣式 */
        .draggable-item {
            cursor: grab;
            touch-action: none;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .draggable-item:hover {
            transform: scale(1.1) rotate(3deg);
        }
        .draggable-item.dragging {
            cursor: grabbing;
            z-index: 9999 !important;
            transform: scale(1.22) rotate(-5deg);
            filter: drop-shadow(0 14px 12px rgba(0,0,0,0.28));
            transition: none !important;
        }
        .drop-zone {
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            transform: scale(1.05);
            background-color: #FEF9C3 !important;
            border-color: #F59E0B !important;
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.4);
        }
        /* 紙花特效容器 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="pb-14 text-slate-800 select-none">

    <!-- 慶祝紙花 Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 頂部卡通導航欄 -->
    <header class="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-500 text-white shadow-lg border-b-4 border-amber-600 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <!-- 卡通小偵探 SVG 頭像 -->
                <div class="w-12 h-12 bg-white rounded-2xl p-1 shadow-md border-2 border-amber-300 animate-float flex items-center justify-center shrink-0">
                    <svg viewBox="0 0 64 64" class="w-10 h-10">
                        <circle cx="32" cy="36" r="18" fill="#FDE68A" stroke="#78350F" stroke-width="3"/>
                        <!-- 偵探帽 -->
                        <path d="M10 26 Q32 6 54 26 Z" fill="#D97706" stroke="#78350F" stroke-width="3"/>
                        <ellipse cx="32" cy="26" rx="26" ry="5" fill="#B45309" stroke="#78350F" stroke-width="3"/>
                        <!-- 眼睛與笑容 -->
                        <circle cx="25" cy="36" r="3" fill="#1E293B"/>
                        <circle cx="39" cy="36" r="3" fill="#1E293B"/>
                        <path d="M25 44 Q32 50 39 44" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
                        <!-- 放大鏡 -->
                        <circle cx="48" cy="44" r="9" fill="#E0F2FE" fill-opacity="0.85" stroke="#0284C7" stroke-width="3.5"/>
                        <line x1="54" y1="50" x2="61" y2="57" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <div class="text-[11px] md:text-xs font-bold text-amber-100 leading-none">香海正覺蓮社佛教正慧小學・P.3 數學</div>
                    <h1 class="text-lg md:text-2xl font-black tracking-tight drop-shadow mt-0.5">除法小偵探 (3.2) 🕵️‍♂️</h1>
                </div>
            </div>

            <!-- 語音控制按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="speakCurrentQuestion()" class="btn-3d bg-white text-orange-600 font-black px-3 py-1.5 rounded-2xl text-xs md:text-sm flex items-center gap-1 border-2 border-amber-200">
                    <span class="text-lg">🔊</span>
                    <span class="hidden sm:inline">廣東話讀題</span>
                </button>
                <button onclick="stopSpeech()" title="停止朗讀" class="btn-3d bg-rose-600 hover:bg-rose-700 text-white font-black px-2.5 py-1.5 rounded-2xl text-xs border-2 border-rose-300">

            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-5xl mx-auto px-3 md:px-5 mt-4 space-y-5">

        <!-- 5 題卡通圖案選擇卡 -->
        <nav class="grid grid-cols-5 gap-2 md:gap-3" aria-label="題目選擇">
            <button onclick="selectQuestion(1)" id="tab-1" class="btn-3d rounded-3xl py-2.5 px-1 font-black flex flex-col items-center justify-center border-4 transition-all">

                <span class="text-xs md:text-base mt-0.5">第 1 題</span>
                <span id="star-1" class="text-[11px] px-2 py-0.5 rounded-full bg-white/60 text-slate-700 mt-0.5">分糖果</span>

            <button onclick="selectQuestion(2)" id="tab-2" class="btn-3d rounded-3xl py-2.5 px-1 font-black flex flex-col items-center justify-center border-4 transition-all">
                <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-3xl md:text-4xl animate-wiggle">🖊️</div>
                <span class="text-xs md:text-base mt-0.5">第 2 題</span>
                <span id="star-2" class="text-[11px] px-2 py-0.5 rounded-full bg-white/60 text-slate-700 mt-0.5">買原子筆</span>
            </button>
            <button onclick="selectQuestion(3)" id="tab-3" class="btn-3d rounded-3xl py-2.5 px-1 font-black flex flex-col items-center justify-center border-4 transition-all">
                <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-3xl md:text-4xl animate-wiggle">🥚</div>
                <span class="text-xs md:text-base mt-0.5">第 3 題</span>
                <span id="star-3" class="text-[11px] px-2 py-0.5 rounded-full bg-white/60 text-slate-700 mt-0.5">裝雞蛋</span>
            </button>
            <button onclick="selectQuestion(4)" id="tab-4" class="btn-3d rounded-3xl py-2.5 px-1 font-black flex flex-col items-center justify-center border-4 transition-all">
                <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-3xl md:text-4xl animate-wiggle">🏓</div>
                <span class="text-xs md:text-base mt-0.5">第 4 題</span>
                <span id="star-4" class="text-[11px] px-2 py-0.5 rounded-full bg-white/60 text-slate-700 mt-0.5">乒乓球</span>
            </button>
            <button onclick="selectQuestion(5)" id="tab-5" class="btn-3d rounded-3xl py-2.5 px-1 font-black flex flex-col items-center justify-center border-4 transition-all">
                <div class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-3xl md:text-4xl animate-wiggle">🍊</div>
                <span class="text-xs md:text-base mt-0.5">第 5 題</span>
                <span id="star-5" class="text-[11px] px-2 py-0.5 rounded-full bg-white/60 text-slate-700 mt-0.5">包裝橙</span>
            </button>
        </nav>

        <!-- 題目故事大圖卡 (大字 + 廣東話大喇叭) -->
        <section class="bg-white rounded-3xl p-4 md:p-5 card-cartoon border-4 border-sky-400 relative overflow-hidden">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div id="q-badge" class="bg-sky-500 text-white font-black text-base md:text-lg px-3.5 py-1.5 rounded-2xl shrink-0 shadow">
                        第 1 題
                    </div>
                    <div id="question-text-box" class="text-lg md:text-xl font-black text-slate-800 leading-snug">
                        <!-- 動態載入題目 -->
                    </div>
                </div>
                <button onclick="speakCurrentQuestion()" class="btn-3d pulse-glow bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black px-5 py-3 rounded-2xl flex items-center gap-2 shrink-0 text-base md:text-lg border-2 border-amber-200 w-full sm:w-auto justify-center">
                    <span class="text-2xl">🔊</span>
                    <span>聽題目</span>
                </button>
            </div>
        </section>

        <!-- 步驟 1：動手拉動分物遊樂場 (Interactive Drag & Drop Stage) -->
        <section class="bg-white rounded-3xl p-4 md:p-6 card-cartoon border-4 border-purple-400 relative">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                    <span class="bg-purple-600 text-white font-black px-3 py-1 rounded-xl text-sm md:text-base shadow">步驟 1</span>
                    <h2 class="text-base md:text-xl font-black text-purple-800 flex items-center gap-1.5">
                        <span>✋</span> 用手指拉動圖畫分分看！
                    </h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="speakStageGuide()" class="btn-3d bg-purple-100 hover:bg-purple-200 text-purple-800 font-black px-3 py-1.5 rounded-xl text-xs md:text-sm flex items-center gap-1 border border-purple-300">
                        <span>🔊</span> 玩法提示
                    </button>
                    <button onclick="resetStage()" class="btn-3d bg-slate-100 hover:bg-slate-200 text-slate-700 font-black px-3 py-1.5 rounded-xl text-xs md:text-sm flex items-center gap-1 border border-slate-300">
                        <span>🔄</span> 再玩一次
                    </button>
                </div>
            </div>

            <!-- 互動畫布區 -->
            <div id="interactive-stage" class="bg-gradient-to-b from-purple-50/80 to-indigo-50/60 rounded-3xl p-4 md:p-5 border-2 border-dashed border-purple-300 min-h-[290px] flex flex-col justify-between relative overflow-hidden">
                <!-- 由 JS 根據題目動態生成 SVG 與拖放元素 -->
            </div>
        </section>

        <!-- 步驟 2 & 3：雙欄圖象闖關 (左：列式拼圖，右：答題處理圖卡) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

            <!-- 步驟 2：橫式密碼鎖 -->
            <section class="bg-white rounded-3xl p-4 md:p-5 card-cartoon border-4 border-emerald-400 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-600 text-white font-black px-3 py-1 rounded-xl text-sm shadow">步驟 2</span>
                            <h2 class="text-base md:text-lg font-black text-emerald-800">🧩 揀啱「除數」列橫式</h2>
                        </div>
                        <button onclick="speakDivisorPrompt()" class="btn-3d bg-emerald-100 text-emerald-800 font-black px-2.5 py-1 rounded-xl text-xs border border-emerald-300">
                            🔊 聽提示
                        </button>
                    </div>

                    <!-- 大型算式展示牌 (不顯示答案) -->
                    <div id="equation-board" class="bg-emerald-50 border-3 border-emerald-300 rounded-2xl p-4 text-center my-2">
                        <!-- JS 動態載入 -->
                    </div>
                </div>

                <!-- 除數選擇按鈕 -->
                <div id="divisor-choices" class="grid grid-cols-3 gap-2.5 mt-3">
                    <!-- JS 動態載入 -->
                </div>
                <div id="divisor-feedback" class="hidden mt-3 p-3 rounded-2xl font-black text-sm text-center"></div>
            </section>

            <!-- 步驟 3：工作紙「答題處理」五選一圖像卡 -->
            <section class="bg-white rounded-3xl p-4 md:p-5 card-cartoon border-4 border-amber-400 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-amber-500 text-white font-black px-3 py-1 rounded-xl text-sm shadow">步驟 3</span>
                            <h2 class="text-base md:text-lg font-black text-amber-900">☑️ 工作紙「答題處理」剔邊格？</h2>
                        </div>
                        <button onclick="speakText('睇下剛剛拉動圖畫嘅結果，工作紙上面嘅答題處理應該剔邊一格呢？')" class="btn-3d bg-amber-100 text-amber-900 font-black px-2.5 py-1 rounded-xl text-xs border border-amber-300">
                            🔊 聽提示
                        </button>
                    </div>

                    <!-- 5 個與工作紙完全一致的選項（配圖示） -->
                    <div id="handling-options" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <!-- JS 動態載入 -->
                    </div>
                </div>
                <div id="handling-feedback" class="hidden mt-3 p-3 rounded-2xl font-black text-sm text-center"></div>
            </section>

        </div>

        <!-- 步驟 4：工作紙小偵探過關印章卡 (極簡圖示版) -->
        <section class="bg-gradient-to-r from-amber-100 via-yellow-100 to-orange-100 rounded-3xl p-4 md:p-5 card-cartoon border-4 border-amber-500">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="text-4xl animate-bounce">📝</div>
                    <div>
                        <h3 class="text-base md:text-lg font-black text-amber-950">最後一步：自己喺工作紙寫低答案！（撳下面4個印章過關）</h3>
                        <p id="worksheet-extra-tip" class="text-xs md:text-sm font-black text-rose-600 mt-0.5"></p>
                    </div>
                </div>

                <!-- 4 個大圖示打卡按鈕 -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 w-full md:w-auto">
                    <button onclick="toggleStamp(0)" id="stamp-0" class="btn-3d bg-white border-2 border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center text-slate-700 font-black text-xs">
                        <span class="text-2xl mb-0.5">☑️</span>
                        <span>1. 剔好處理</span>
                    </button>
                    <button onclick="toggleStamp(1)" id="stamp-1" class="btn-3d bg-white border-2 border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center text-slate-700 font-black text-xs">
                        <span class="text-2xl mb-0.5">➗</span>
                        <span>2. 寫好橫式</span>
                    </button>
                    <button onclick="toggleStamp(2)" id="stamp-2" class="btn-3d bg-white border-2 border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center text-slate-700 font-black text-xs">
                        <span class="text-2xl mb-0.5">✏️</span>
                        <span>3. 計好直式</span>
                    </button>
                    <button onclick="toggleStamp(3)" id="stamp-3" class="btn-3d bg-white border-2 border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center text-slate-700 font-black text-xs">
                        <span class="text-2xl mb-0.5">💬</span>
                        <span>4. 寫埋答句</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // 1. 音效合成器 (Web Audio API - 卡通音效)
        // ==========================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;

                if (type === 'pickup') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.start(now); osc.stop(now + 0.09);
                } else if (type === 'drop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'correct') {
                    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.08);
                        gain.gain.setValueAtTime(0.22, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
                        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
                    });
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.start(now); osc.stop(now + 0.28);
                }
            } catch (e) {}
        }

        // ==========================================
        // 2. 廣東話語音導航 (Web Speech API)
        // ==========================================
        let cantoneseVoice = null;

        function initVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                cantoneseVoice = voices.find(v => v.lang.toLowerCase().includes('zh-hk') || v.lang.toLowerCase().includes('yue'))
                              || voices.find(v => v.name.toLowerCase().includes('hong kong') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵'))
                              || voices.find(v => v.lang.toLowerCase().includes('zh'));
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            setTimeout(initVoices, 250);
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (!cantoneseVoice) initVoices();
            if (cantoneseVoice) u.voice = cantoneseVoice;
            u.lang = 'zh-HK';
            u.rate = 0.92;
            u.pitch = 1.06;
            window.speechSynthesis.speak(u);
        }

        // ==========================================
        // 3. 通用手勢拖放引擎 (支援滑鼠、iPad觸控及點擊自動移動)
        // ==========================================
        function makeDraggable(el, onDropCallback) {
            let startX = 0, startY = 0;
            let isDragging = false;
            let moved = false;

            el.addEventListener('pointerdown', (e) => {
                if (el.dataset.locked === 'true') return;
                e.preventDefault();
                el.setPointerCapture(e.pointerId);
                playSound('pickup');
                startX = e.clientX;
                startY = e.clientY;
                isDragging = true;
                moved = false;
                el.classList.add('dragging');
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
                el.style.transform = `translate(${dx}px, ${dy}px) scale(1.18)`;

                // 偵測下方 Drop Zone 高亮
                el.style.pointerEvents = 'none';
                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                el.style.pointerEvents = 'auto';
                const dropZone = elemBelow ? elemBelow.closest('.drop-zone') : null;

                document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
                if (dropZone) dropZone.classList.add('drag-over');
            });

            el.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.classList.remove('dragging');
                document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));

                el.style.pointerEvents = 'none';
                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                el.style.pointerEvents = 'auto';
                const dropZone = elemBelow ? elemBelow.closest('.drop-zone') : null;

                el.style.transform = '';

                if (dropZone) {
                    onDropCallback(el, dropZone);
                } else if (!moved) {
                    // 若學生只是輕按一下，貼心支援自動移去可用目標
                    onDropCallback(el, null);
                }
            });
        }

        function checkDivisor(qNum, idx) {
            const q = questions[qNum];
            const opt = q.divisorOptions[idx];
            const fb = document.getElementById('divisor-feedback');
            fb.classList.remove('hidden');

            if (opt.val === q.correctDivisor) {
                playSound('correct');
                document.getElementById('eq-div-slot').textContent = opt.val;
                document.getElementById('eq-div-slot').className = 'px-2.5 py-0.5 bg-emerald-500 text-white rounded-lg pop-in inline-block';

                speakText(opt.hint);

                playSound('wrong');
                fb.className = 'mt-3 p-2.5 rounded-2xl font-black text-xs md:text-sm text-center bg-rose-100 text-rose-900 border-2 border-rose-400 pop-in';
                fb.textContent = '🤔 ' + opt.hint;
                speakText(opt.hint);

        function checkHandling(choiceId) {
            const q = questions[currentQ];
            const fb = document.getElementById('handling-feedback');

            if (choiceId === q.correctHandling) {
                playSound('correct');

                btn.classList.add('shake-no', 'bg-rose-50', 'border-rose-300');
                setTimeout(() => btn.classList.remove('shake-no'), 500);
                fb.className = 'mt-3 p-2.5 rounded-2xl font-black text-xs md:text-sm text-center bg-amber-100 text-amber-900 border-2 border-amber-400 pop-in';
                fb.textContent = '💡 唔係呢格喎！玩多次上面步驟 1 嘅拉動圖畫，睇下餘數要點處理？';
                speakText('唔係呢格喎！試下玩多次上面嘅拉動圖畫，睇下餘數要點樣處理啦！');
            }
        }

        // ==========================================
        // 9. 過關印章與紙花特效
        // ==========================================
        function toggleStamp(idx) {
            playSound('drop');
            stampsState[idx] = !stampsState[idx];
            updateStampUI(idx);

            if (stampsState.every(Boolean)) {
                playSound('correct');
                launchConfetti();
                speakText('好嘢！你已經完成晒呢一題嘅4個步驟喇！');
                const starBadge = document.getElementById(`star-${currentQ}`);
                if (starBadge && !starBadge.textContent.includes('⭐')) {
                    starBadge.textContent = '⭐ ' + starBadge.textContent;
                    starBadge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-emerald-500 text-white mt-0.5 font-black';
                }
            }
        }

        function updateStampUI(idx) {
            const btn = document.getElementById(`stamp-${idx}`);
            if (!btn) return;
            if (stampsState[idx]) {
                btn.className = 'btn-3d bg-emerald-500 text-white border-2 border-emerald-700 rounded-2xl p-2.5 flex flex-col items-center justify-center font-black text-xs scale-105';
            } else {
                btn.className = 'btn-3d bg-white border-2 border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center text-slate-700 font-black text-xs';
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = Array.from({ length: 75 }, () => ({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * 200,
                w: Math.random() * 10 + 6,
                h: Math.random() * 10 + 6,
                color: ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'][Math.floor(Math.random() * 5)],
                vy: Math.random() * 4 + 3,
                vx: Math.random() * 4 - 2,
                angle: Math.random() * 360
            }));

            let f = 0;
            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy; p.x += p.vx; p.angle += 6;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                if (++f < 110) requestAnimationFrame(frame);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            frame();
        }

        window.onload = () => selectQuestion(1);
    </script>
</body>
