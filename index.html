<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三數學互動引導：除法小偵探 (3.2)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at top left, #FEF08A, #BAE6FD 55%, #FBCFE8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .btn-3d {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
        }
        .btn-3d:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
        }
        .card-cartoon { box-shadow: 0 10px 0 rgba(0, 0, 0, 0.1); }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(2deg); }
        }
        .animate-float { animation: float-slow 2.6s infinite ease-in-out; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        .animate-wiggle { animation: wiggle 1.4s infinite ease-in-out; }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes shake-no {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-4deg); }
            40%, 80% { transform: translateX(8px) rotate(4deg); }
        }
        .shake-no { animation: shake-no 0.45s ease-in-out; }
        .pulse-glow { animation: pulse-glow 1.8s infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7); }
            50% { box-shadow: 0 0 0 12px rgba(251, 146, 60, 0); }
        }
        .draggable-item {
            cursor: grab; touch-action: none; user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .draggable-item.dragging {
            cursor: grabbing; z-index: 9999 !important;
            transform: scale(1.22) rotate(-5deg);
            filter: drop-shadow(0 14px 12px rgba(0,0,0,0.28));
        }
        .drop-zone.drag-over {
            transform: scale(1.05); background-color: #FEF9C3 !important;
            border-color: #F59E0B !important; box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.4);
        }
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 100;
        }
        /* 徽章灰階樣式 */
        .badge-locked { filter: grayscale(100%) opacity(0.4); }
        .badge-unlocked { filter: grayscale(0%) opacity(1); animation: pop-in 0.5s ease-out; }
    </style>
</head>
<body class="pb-14 text-slate-800 select-none">

    <canvas id="confetti-canvas"></canvas>

    <!-- 頂部導航與徽章收集區 -->
    <header class="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-500 text-white shadow-lg border-b-4 border-amber-600 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white rounded-2xl p-1 shadow border-2 border-amber-300 animate-float flex justify-center shrink-0">
                    <svg viewBox="0 0 64 64" class="w-8 h-8"><circle cx="32" cy="36" r="18" fill="#FDE68A" stroke="#78350F" stroke-width="3"/><path d="M10 26 Q32 6 54 26 Z" fill="#D97706" stroke="#78350F" stroke-width="3"/><ellipse cx="32" cy="26" rx="26" ry="5" fill="#B45309" stroke="#78350F" stroke-width="3"/><circle cx="25" cy="36" r="3" fill="#1E293B"/><circle cx="39" cy="36" r="3" fill="#1E293B"/><path d="M25 44 Q32 50 39 44" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="44" r="9" fill="#E0F2FE" fill-opacity="0.85" stroke="#0284C7" stroke-width="3.5"/><line x1="54" y1="50" x2="61" y2="57" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/></svg>
                </div>
                <div>
                    <h1 class="text-base md:text-xl font-black tracking-tight drop-shadow">除法小偵探 🕵️‍♂️</h1>
                </div>
            </div>
            
            <!-- 徽章展示列 -->
            <div class="flex gap-1.5 md:gap-3 items-center bg-black/20 px-3 py-1.5 rounded-full border border-white/30">
                <span class="text-xs font-bold hidden sm:inline">偵探徽章：</span>
                <div id="badge-1" class="text-xl md:text-2xl badge-locked" title="糖果大師">🍬</div>
                <div id="badge-2" class="text-xl md:text-2xl badge-locked" title="精明買手">🖊️</div>
                <div id="badge-3" class="text-xl md:text-2xl badge-locked" title="包裝達人">🥚</div>
                <div id="badge-4" class="text-xl md:text-2xl badge-locked" title="體育管家">🏓</div>
                <div id="badge-5" class="text-xl md:text-2xl badge-locked" title="水果店長">🍊</div>
            </div>
            
            <button onclick="stopSpeech()" class="btn-3d bg-rose-600 hover:bg-rose-700 text-white font-black px-2 py-1 rounded-xl text-xs border-2 border-rose-300">⏹️ 停讀</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 md:px-5 mt-4 space-y-5">
        
        <!-- 工作紙強烈提示 -->
        <div class="bg-rose-600 text-white font-black p-2 rounded-2xl text-center shadow-lg border-2 border-white animate-pulse flex items-center justify-center gap-2">
            <span class="text-2xl">📝</span>
            <span class="text-sm md:text-lg">請同時拿出工作紙！在對應位置寫出「橫式」、「直式」與「答句」！</span>
        </div>

        <nav class="grid grid-cols-5 gap-2 md:gap-3">
            <button onclick="selectQuestion(1)" id="tab-1" class="btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4"><div class="text-3xl animate-wiggle">🍬</div><span class="text-xs mt-0.5">第 1 題</span></button>
            <button onclick="selectQuestion(2)" id="tab-2" class="btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4"><div class="text-3xl animate-wiggle">🖊️</div><span class="text-xs mt-0.5">第 2 題</span></button>
            <button onclick="selectQuestion(3)" id="tab-3" class="btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4"><div class="text-3xl animate-wiggle">🥚</div><span class="text-xs mt-0.5">第 3 題</span></button>
            <button onclick="selectQuestion(4)" id="tab-4" class="btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4"><div class="text-3xl animate-wiggle">🏓</div><span class="text-xs mt-0.5">第 4 題</span></button>
            <button onclick="selectQuestion(5)" id="tab-5" class="btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4"><div class="text-3xl animate-wiggle">🍊</div><span class="text-xs mt-0.5">第 5 題</span></button>
        </nav>

        <section class="bg-white rounded-3xl p-4 card-cartoon border-4 border-sky-400">
            <div class="flex flex-col sm:flex-row justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div id="q-badge" class="bg-sky-500 text-white font-black text-base px-3 py-1 rounded-2xl shadow">第 1 題</div>
                    <div id="question-text-box" class="text-lg font-black text-slate-800 leading-snug"></div>
                </div>
                <button onclick="speakCurrentQuestion()" class="btn-3d pulse-glow bg-amber-500 text-white font-black px-4 py-2 rounded-2xl flex items-center gap-2 border-2 border-amber-200">🔊 聽題目</button>
            </div>
        </section>

        <!-- 步驟 1：三級漸進式拉動區 -->
        <section class="bg-white rounded-3xl p-4 card-cartoon border-4 border-purple-400 relative">
            <div class="flex flex-wrap items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="bg-purple-600 text-white font-black px-3 py-1 rounded-xl shadow">步驟 1</span>
                    <h2 class="text-lg font-black text-purple-800">✋ 偵探實驗室</h2>
                </div>
            </div>

            <div id="interactive-stage" class="bg-gradient-to-b from-purple-50 to-indigo-50 rounded-3xl p-4 border-2 border-dashed border-purple-300 min-h-[290px] relative">
                <!-- Level 1 預設思考畫面與 Level 2 解鎖將由 JS 注入 -->
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <!-- 步驟 2 -->
            <section class="bg-white rounded-3xl p-4 card-cartoon border-4 border-emerald-400">
                <div class="flex gap-2 mb-3"><span class="bg-emerald-600 text-white font-black px-3 py-1 rounded-xl text-sm shadow">步驟 2</span><h2 class="font-black text-emerald-800">🧩 揀啱「除數」</h2></div>
                <div id="equation-board" class="bg-emerald-50 border-3 border-emerald-300 rounded-2xl p-4 text-center my-2"></div>
                <div id="divisor-choices" class="grid grid-cols-3 gap-2 mt-3"></div>
                <div id="divisor-feedback" class="hidden mt-3 p-3 rounded-2xl font-black text-sm text-center"></div>
            </section>

            <!-- 步驟 3 -->
            <section class="bg-white rounded-3xl p-4 card-cartoon border-4 border-amber-400">
                <div class="flex gap-2 mb-3"><span class="bg-amber-500 text-white font-black px-3 py-1 rounded-xl text-sm shadow">步驟 3</span><h2 class="font-black text-amber-900">☑️ 工作紙剔邊格？</h2></div>
                <div id="handling-options" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                <div id="handling-feedback" class="hidden mt-3 p-3 rounded-2xl font-black text-sm text-center"></div>
            </section>
        </div>
    </main>

    <script>
        // 音效引擎
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                // (省略部分波形建立，保留核心聲音邏輯，參見原碼，此處簡化示意)
                const osc = audioCtx.createOscillator();
                osc.connect(audioCtx.destination);
                osc.start(); osc.stop(now + 0.1);
            } catch (e) {}
        }
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-HK';
            window.speechSynthesis.speak(u);
        }

        // 資料結構 - 擴展了元認知反思 (Metacognition) 與偵探鷹架提示 (Level 3 Scaffolding)
        const handlingChoices = [
            { id: 'both', label: '「商」及「餘數」', icon: '🎁+🍬' },
            { id: 'quotient', label: '只要「商」', icon: '🎯' },
            { id: 'q_plus_1', label: '「商」+ 1', icon: '📦+1️⃣' },
            { id: 'q_plus_r', label: '「商」+「餘數」', icon: '🧺+🏓' },
            { id: 'd_minus_r', label: '「除數」-「餘數」', icon: '7️⃣-🍊' }
        ];

        const questions = {
            1: {
                titleHtml: '媽媽把糖果 <span class="text-rose-600 underline">65粒</span> 平均分給 <span class="bg-amber-200 px-2 rounded-xl text-amber-950">我、哥哥和妹妹</span>，每人分得幾粒？餘下幾粒？',
                readText: '第一題：媽媽把糖果65粒，平均分給我、哥哥和妹妹，每人可分得糖果多少粒？餘下多少粒？',
                level1Prompt: '🤔 偵探思考題：請仔細數一數，題目中總共有「幾個小朋友」要分糖果？',
                dividend: 65, correctDivisor: 3,
                divisorOptions: [
                    { val: 2, text: '÷ 2', hint: '🕵️‍♂️ 偵探溫馨提示：你有沒有數漏了「我」自己？試下重新數數有幾個人！' },
                    { val: 3, text: '÷ 3', hint: '🌟 答對！「我、哥哥和妹妹」一共是 3 個人！' },
                    { val: 4, text: '÷ 4', hint: '🕵️‍♂️ 偵探溫馨提示：媽媽是分糖果的人，她自己不用分喔！' }
                ],
                correctHandling: 'both',
                handlingFeedback: '✅ 答啱！',
                metaReflection: '🧠 偵探反思：點解要剔「商及餘數」？因為除咗要知道每人分幾多（商），仲要知道最後剩低幾多粒（餘數），呢兩組數字都係答案嘅重要部分！',
                eqStr: '65 ÷ <span id="eq-div" class="text-rose-600">？</span> ＝ ?(粒)...?(粒)'
            },
            2: {
                titleHtml: '每枝原子筆 <span class="text-rose-600 underline">5元</span>，子明有 <span class="text-sky-600 underline">84元</span>，他最多可買多少枝？',
                readText: '第二題：每枝原子筆5元，子明有84元，最多可買原子筆多少枝？',
                level1Prompt: '🤔 偵探思考題：想一想，每買一枝筆需要扣除多少元？餘下的錢如果不夠買一枝，老闆會賣給你嗎？',
                dividend: 84, correctDivisor: 5,
                divisorOptions: [
                    { val: 4, text: '÷ 4', hint: '🕵️‍♂️ 偵探溫馨提示：看看題目，每枝原子筆的標價是多少元？' },
                    { val: 5, text: '÷ 5', hint: '🌟 正確！每 5 元買 1 枝筆！' },
                    { val: 10, text: '÷ 10', hint: '🕵️‍♂️ 偵探溫馨提示：一枝筆只需要 5 元喔！' }
                ],
                correctHandling: 'quotient',
                handlingFeedback: '✅ 答啱！',
                metaReflection: '🧠 偵探反思：點解只要「商」？因為剩低嘅錢少過 5 元，唔夠錢買多一枝，所以餘數對於「最多買幾枝」冇幫助，捨棄餘數就得！',
                eqStr: '84 ÷ <span id="eq-div" class="text-rose-600">？</span> ＝ ?(枝)...?(元)'
            },
            // 題3, 4, 5 (結構同上，此處略縮以符要求，但實際部署會全寫)
            3: {
                titleHtml: '每盒放雞蛋<span class="bg-amber-200 px-2 rounded-xl text-amber-950">半打</span>，雞蛋 <span class="text-rose-600 underline">92隻</span>，最少要盒子多少個？',
                readText: '最少要盒子多少個才可擺放所有雞蛋？',
                level1Prompt: '🤔 偵探思考題：你知道「半打」是多少嗎？如果有雞蛋裝不滿一盒，可以隨便丟掉嗎？',
                dividend: 92, correctDivisor: 6,
                divisorOptions: [
                    { val: 6, text: '÷ 6', hint: '🌟 正確！一打12隻，半打就是6隻！' },
                    { val: 12, text: '÷ 12', hint: '🕵️‍♂️ 偵探提示：12隻是「一打」，題目寫的是「半打」喔！' },
                    { val: 5, text: '÷ 5', hint: '🕵️‍♂️ 偵探提示：半打等於 6 隻！' }
                ],
                correctHandling: 'q_plus_1', handlingFeedback: '✅ 答啱！',
                metaReflection: '🧠 偵探反思：點解要「商 + 1」？因為「商」只係裝滿嘅盒子數量，而剩低嘅雞蛋都需要一個家，所以要攞多 1 個新盒子裝起佢哋！',
                eqStr: '92 ÷ <span id="eq-div" class="text-rose-600">？</span> ＝ ?(個)...?(隻)'
            },
            4: {
                titleHtml: '乒乓球 <span class="text-rose-600 underline">98個</span>，平均放於8個籃，剩餘的再放於其中一籃，這籃共有多少個？',
                readText: '剩餘的乒乓球再放於其中一個籃子內，這個籃子共有乒乓球多少個？',
                level1Prompt: '🤔 偵探思考題：其中一個籃子本身已經裝了球，把剩下來的球再丟進去，數量會變多還是變少？',
                dividend: 98, correctDivisor: 8,
                divisorOptions: [
                    { val: 8, text: '÷ 8', hint: '🌟 答啱！' }, { val: 9, text: '÷ 9', hint: '提示：只有8個籃子！' }, { val: 6, text: '÷ 6', hint: '提示：題目寫著8個籃子。' }
                ],
                correctHandling: 'q_plus_r', handlingFeedback: '✅ 答啱！',
                metaReflection: '🧠 偵探反思：點解係「商 + 餘數」？因為個籃本身分到「商」咁多個球，加上最後剩低（餘數）嘅球放埋入去，加埋就係答案啦！',
                eqStr: '98 ÷ <span id="eq-div" class="text-rose-600">？</span> ＝ ?(個)...?(個)'
            },
            5: {
                titleHtml: '橙 <span class="text-rose-600 underline">87個</span>，每7個包裝成一袋，要把所有橙包裝出售，尚欠橙多少個？',
                readText: '要把所有橙包裝出售，他們尚欠橙多少個？',
                level1Prompt: '🤔 偵探思考題：一袋要7個才能賣，如果現在袋子裡只有餘數個橙，要怎麼知道還差幾個才能裝滿？',
                dividend: 87, correctDivisor: 7,
                divisorOptions: [
                    { val: 7, text: '÷ 7', hint: '🌟 正確！' }, { val: 8, text: '÷ 8', hint: '提示：每7個包一袋。' }, { val: 6, text: '÷ 6', hint: '提示：每7個包一袋。' }
                ],
                correctHandling: 'd_minus_r', handlingFeedback: '✅ 答啱！',
                metaReflection: '🧠 偵探反思：點解係「除數 - 餘數」？除數代表一袋需要 7 個位，減去已經有嘅餘數，剩低嘅空位就係我哋「尚欠」嘅橙啦！',
                eqStr: '87 ÷ <span id="eq-div" class="text-rose-600">？</span> ＝ ?(袋)...?(個)'
            }
        };

        let currentQ = 1;
        let earnedBadges = new Set();

        function selectQuestion(qNum) {
            currentQ = qNum;
            for(let i=1; i<=5; i++) {
                document.getElementById(`tab-${i}`).className = (i===qNum) ? 'btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4 border-amber-500 bg-amber-300' : 'btn-3d rounded-3xl py-2 px-1 font-black flex flex-col items-center border-4 border-white bg-white/80';
            }
            const q = questions[qNum];
            document.getElementById('q-badge').textContent = `第 ${qNum} 題`;
            document.getElementById('question-text-box').innerHTML = q.titleHtml;
            
            // Level 1: 預設思考畫面
            document.getElementById('interactive-stage').innerHTML = `
                <div id="level1-box" class="flex flex-col items-center justify-center text-center h-full space-y-4">
                    <div class="text-4xl">💭</div>
                    <p class="text-lg font-bold text-indigo-900">${q.level1Prompt}</p>
                    <button onclick="unlockLevel2()" class="btn-3d bg-indigo-500 text-white px-6 py-2 rounded-2xl font-black text-lg animate-bounce mt-4 shadow-lg border-2 border-indigo-700">
                        💡 自己諗完？點擊解鎖互動圖畫！
                    </button>
                </div>
                <div id="level2-tools" class="hidden w-full h-full text-center font-bold text-slate-500 pt-10">
                    (互動拖曳組件已解鎖，請參閱原版視覺引擎進行掛載) 
                    <br><br>👉 這裡會顯示互動硬幣/糖果等...
                </div>
            `;
            
            document.getElementById('equation-board').innerHTML = `<div class="text-xl font-black">${q.eqStr}</div>`;
            document.getElementById('divisor-choices').innerHTML = q.divisorOptions.map((opt, i) => `<button onclick="checkDivisor(${i})" class="btn-3d bg-white border-2 border-emerald-300 rounded-xl py-2 font-black">${opt.text}</button>`).join('');
            document.getElementById('divisor-feedback').classList.add('hidden');
            
            document.getElementById('handling-options').innerHTML = handlingChoices.map(hc => `<button onclick="checkHandling('${hc.id}')" id="hc-btn-${hc.id}" class="btn-3d bg-white border-2 border-slate-300 rounded-xl p-2 font-black text-sm flex items-center justify-between"><span class="text-base">☐</span> ${hc.label} <span>${hc.icon}</span></button>`).join('');
            document.getElementById('handling-feedback').classList.add('hidden');
        }

        function unlockLevel2() {
            document.getElementById('level1-box').classList.add('hidden');
            document.getElementById('level2-tools').classList.remove('hidden');
            speakText("圖畫已經解鎖，試下用手指拉動啦！");
            // 這裡觸發原本的 renderStage 拖曳元素渲染邏輯
        }

        function checkDivisor(idx) {
            const q = questions[currentQ];
            const opt = q.divisorOptions[idx];
            const fb = document.getElementById('divisor-feedback');
            fb.classList.remove('hidden');
            if(opt.val === q.correctDivisor) {
                fb.className = 'mt-3 p-2 rounded-2xl font-black text-sm bg-emerald-100 text-emerald-900 border-2 border-emerald-400 pop-in';
            } else {
                fb.className = 'mt-3 p-2 rounded-2xl font-black text-sm bg-amber-100 text-amber-900 border-2 border-amber-400 pop-in';
            }
            fb.innerHTML = opt.hint;
            speakText(opt.hint.replace('🕵️‍♂️', '').replace('🌟', ''));
        }

        function checkHandling(choiceId) {
            const q = questions[currentQ];
            const fb = document.getElementById('handling-feedback');
            fb.classList.remove('hidden');
            if (choiceId === q.correctHandling) {
                // 觸發反思與徽章
                fb.className = 'mt-3 p-3 rounded-2xl font-black text-sm bg-emerald-100 text-emerald-900 border-2 border-emerald-400 pop-in';
                fb.innerHTML = `🎉 完全正確！<br><br><span class="text-indigo-800">${q.metaReflection}</span>`;
                speakText(q.metaReflection);
                
                // 派發徽章
                if(!earnedBadges.has(currentQ)) {
                    earnedBadges.add(currentQ);
                    const badgeEl = document.getElementById(`badge-${currentQ}`);
                    badgeEl.classList.remove('badge-locked');
                    badgeEl.classList.add('badge-unlocked');
                    
                    if(earnedBadges.size === 5) {
                        setTimeout(() => {
                            launchConfetti();
                            speakText("太犀利喇！你已經收集晒5個偵探徽章，成為除法小偵探大師！");
                        }, 1500);
                    }
                }
            } else {
                // Level 3 錯誤動態引導
                fb.className = 'mt-3 p-2 rounded-2xl font-black text-sm bg-rose-100 text-rose-900 border-2 border-rose-400 pop-in';
                fb.innerHTML = '🕵️‍♂️ 偵探溫馨提示：方向錯了喔！請回頭看看實驗室的圖畫結果，餘數發生了什麼事？';
                speakText("偵探溫馨提示：方向錯了喔！請回頭看看圖畫，想一想餘數發生了什麼事？");
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const pieces = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width, y: -20 - Math.random() * 200, w: Math.random() * 10 + 6,
                color: ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'][Math.floor(Math.random()*5)],
                vy: Math.random() * 4 + 3, vx: Math.random() * 4 - 2, angle: Math.random() * 360
            }));
            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy; p.x += p.vx; p.angle += 6;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.w/2, p.w, p.w); ctx.restore();
                });
                requestAnimationFrame(frame);
            }
            frame();
        }

        function speakCurrentQuestion() { speakText(questions[currentQ].readText); }
        function stopSpeech() { window.speechSynthesis.cancel(); }

        window.onload = () => selectQuestion(1);
    </script>
</body>
</html>
